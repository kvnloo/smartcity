<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b09" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SmartCity — Chicagoland lookdev</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%238fbf6a' width='16' height='16'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="stage">
      <div id="fallback" hidden aria-hidden="true"></div>
      <div id="map" role="application" aria-label="Chicagoland cinematic lookdev"></div>
      <div class="grade" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <header class="hud top">
        <p class="kicker">SmartCity lookdev · not the full sim</p>
        <h1 id="clock">Mon 07:30</h1>
        <p id="lod-chip" class="chip" aria-label="Device lookdev LOD">LOD · …</p>
      </header>
      <section class="hud sheet" aria-label="Operating picture">
        <p id="status">Acquiring Maxar/Esri and city mesh…</p>
        <p id="fidelity" class="fidelity" aria-label="Nested twin engines"></p>
        <ul id="lanes"></ul>
        <p id="hot" class="hot"></p>
        <p class="fine">
          Galaxy-class phones get terrain + extruded OSM masses. Thinner devices
          stream satellite only. The full twin is Unreal + SUMO, not this GitHub
          Pages camera.
        </p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
