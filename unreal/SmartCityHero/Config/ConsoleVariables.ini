; 3080 Ti 10 GB — applied at editor/game startup.
; Lumen software GI. Virtual Shadow Maps off. No hardware RT.
[Startup]
r.Lumen.HardwareRayTracing=0
r.RayTracing=0
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.MaxCascades=2
r.Streaming.PoolSize=1400
r.Lumen.ScreenProbeGather.DownsampleFactor=2
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=180
r.Lumen.ScreenProbeGather.TracingOctahedronResolution=8
r.Lumen.ScreenProbeGather.IntegrationsRate=0.5
r.LumenScene.FarField=0
r.Nanite.MaxPixelsPerEdge=1
r.ContactShadows=1
wp.Runtime.BlockOnSlowStreaming=0
wp.Runtime.UpdateStreamingSources=1
