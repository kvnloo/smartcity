name: verified-oss-loop

on:
  push:
    branches: [nightly, main, preview, dev]
  pull_request:
  workflow_dispatch:

# Least privilege by default. pages:write + id-token:write live only on the pages job.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Lookdev TDD + build
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build
      - name: Confirm Pages static files
        if: github.ref == 'refs/heads/nightly' && github.event_name != 'pull_request'
        run: |
          test -f site/dist/.nojekyll
          test -f site/dist/index.html
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/nightly' && github.event_name != 'pull_request'
        with:
          path: site/dist

  pages:
    if: github.repository == 'kvnloo/smartcity' && github.ref == 'refs/heads/nightly' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
